<article class="metric-card">
  <ng-icon class="metric-card__icon" [name]="icon()" aria-hidden="true" />
  <div class="metric-card__content">
    <span class="metric-card__label">{{ label() }}</span>
    <div class="metric-card__value">
      <strong>{{ value() }}</strong>
      <span>{{ unit() }}</span>
    </div>
  </div>
</article>
